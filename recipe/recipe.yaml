schema_version: 1

context:
  name: composio
  version: "0.23.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/composio-${{ version }}.tar.gz
  sha256: 286a8329ab5e3f627f01d31d2949d4065cc64c901f483a82f51b283de0865b03

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - requests >=2.32.2
    - urllib3 >=2
    - jsonschema >=4.23.0
    - json-schema-to-pydantic >=0.4.11
    - python >=${{ python_min }},<4.0
    - pysher >=1.0.8
    - pydantic >=2.11.9
    - composio-client ==1.43.0
    - typing_extensions >=4.16.0
    - openai >=2.48.0

tests:
  - python:
      imports:
        - composio
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: SDK for integrating Composio with your applications.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/composiohq/composio

extra:
  recipe-maintainers:
    - jan-janssen
