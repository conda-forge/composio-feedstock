{% set name = "composio" %}
{% set version = "0.17.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/composio-{{ version }}.tar.gz
  sha256: 3af198770b85aace1c27d21abec4d3ecd7905b5ef0cc426d5f036d12eba37933

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - json-schema-to-pydantic >=0.4.11
    - python >={{ python_min }},<4.0
    - pysher >=1.0.8
    - pydantic >=2.13.4
    - composio-client ==1.41.0
    - typing_extensions >=4.15.0
    - openai >=2.42.0

test:
  imports:
    - composio
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/composiohq/composio
  summary: SDK for integrating Composio with your applications.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
